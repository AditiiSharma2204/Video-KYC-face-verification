[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aadhaar-face-match"
version = "1.0.0"
description = "Verify a live selfie against the photo on an Aadhaar document (detection, alignment, ArcFace embeddings, calibrated decisions, REST API and UI)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8,<5",  # 5.x dropped CascadeClassifier (Haar fallback); full build because DeepFace requires it
    "pymupdf>=1.24",
]

[project.optional-dependencies]
ml = ["deepface>=0.0.93", "tf-keras>=2.16"]  # brings TensorFlow; use Python 3.10-3.12
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
app = ["streamlit>=1.40"]
eval = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "fastapi>=0.110", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
