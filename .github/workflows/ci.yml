name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # tesseract: the real-OCR tests run here (they skip locally if it's missing); libgl1: OpenCV runtime.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1
      # Core + dev extras only: the suite injects fake embedders / eye trackers / speech-to-text,
      # so TensorFlow, MediaPipe and Whisper are not needed (and CI stays fast).
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app
      - run: pytest
