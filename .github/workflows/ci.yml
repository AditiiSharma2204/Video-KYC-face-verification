name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1  # cv2 (full opencv-python) needs libGL
      # Core + dev extras only: the test-suite injects a fake embedder, so TensorFlow is not needed.
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app
      - run: pytest
